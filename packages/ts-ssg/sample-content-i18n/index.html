<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>PureStack i18n Sample</title>
    <meta name="robots" content="noindex">
    <link rel="canonical" href="/en/">
    <link rel="alternate" hreflang="en" href="/en/">
    <link rel="alternate" hreflang="de" href="/de/">
    <meta http-equiv="refresh" content="0; url=/en/">
    <script>
      (() => {
        const language = navigator.language || ''
        location.replace(language.toLowerCase().startsWith('de') ? '/de/' : '/en/')
      })()
    </script>
  </head>
  <body>
    <main>
      <h1>PureStack i18n Sample</h1>
      <p><a href="/en/">Open English version</a></p>
      <p><a href="/de/">Deutsche Version oeffnen</a></p>
    </main>
  </body>
</html>
